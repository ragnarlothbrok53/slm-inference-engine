[project]
name = "slm-runtime"
version = "0.1.0"
description = "A small, observable inference server for local small language models (llama.cpp / MLX backends)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "loguru>=0.7",
    "psutil>=5.9",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Backends are optional so the server, tests and benchmarks install anywhere.
llama = ["llama-cpp-python>=0.3"]
mlx = ["mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
slm-runtime = "slm_runtime.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-psutil",
]

# Prebuilt CPU wheels for llama-cpp-python (Linux/macOS/Windows), so installing does not
# require a C++ toolchain. For CUDA/Metal builds, see the llama-cpp-python docs.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["llama_cpp.*", "mlx_lm.*", "mlx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
